spring.application.name=bei-bora-rest

server.port=6060
logging.file.path=/opt/expressway-restaurant/expressway-orders-rest/logs

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.compression.enabled=true
server.compression.mime-types=text/html,application/json

spring.config.import=file:/opt/expressway-restaurant/expressway-orders-rest/conf/mysql.properties,\
    file:/opt/expressway-restaurant/expressway-orders-rest/conf/mongodb.properties,\
    file:/opt/expressway-restaurant/expressway-orders-rest/conf/email.properties,\
    file:/opt/expressway-restaurant/expressway-orders-rest/conf/rabbitmq.properties,\
    file:/opt/expressway-restaurant/expressway-orders-rest/conf/sms.properties,\
    file:/opt/expressway-restaurant/expressway-orders-rest/conf/jwt.properties,\
    file:/opt/expressway-restaurant/expressway-orders-rest/conf/entity-log.properties,\
    file:/opt/expressway-restaurant/expressway-orders-rest/conf/app.properties,\
    file:/opt/expressway-restaurant/expressway-orders-rest/conf/mpesa.properties

