spring.config.import=optional:file:./secrets.properties
spring.application.name=backend
server.port=${secrets.port}

spring.datasource.url=${secrets.db.url}
spring.datasource.username=${secrets.db.username}
spring.datasource.password=${secrets.db.password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.format_sql=true

#jwt secret key
jwt.secret=${secrets.jwt.secret}
jwt.expiration=86400000

#configuring spring message source
spring.messages.basename=messages
spring.messages.encoding=UTF-8
